<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сравнение кодеков</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#19232d;font:16px system-ui;letter-spacing:0}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 20px}nav{display:flex;gap:16px;flex-wrap:wrap;align-items:end;border-bottom:1px solid #b8c1ca;padding:0 0 20px}label{display:grid;gap:6px;font-size:14px}select,button,textarea{font:inherit;padding:9px;border:1px solid #8b99a7;border-radius:4px;background:white;color:inherit}button{cursor:pointer;color:white;background:#146b59;border-color:#146b59}h2{font-size:18px;margin:26px 0 10px}article{border-top:1px solid #d1d7df;padding:16px 0}article p{margin:0 0 8px;overflow-wrap:anywhere;font-size:14px}audio{width:100%;height:42px}textarea{width:100%;min-height:90px;resize:vertical}footer{margin-top:24px;display:grid;gap:12px}.note{color:#536171;font-size:14px;line-height:1.5}a{color:#176bc0}button:focus-visible,select:focus-visible{outline:3px solid #bf7b13}#message{min-height:20px}@media(max-width:600px){main{padding:16px}nav label{width:100%}select{width:100%}h1{font-size:23px}}
</style>
<main><h1>Сравнение кодеков</h1><nav><label>Запись<select id="sample"></select></label><label>Кодек<select id="codec"><option value="all">Все</option></select></label><label>Условия<select id="condition"><option value="clean">Без потерь</option><option value="loss">С потерями</option></select></label></nav>
<p class="note">Предварительные записи на компьютере, не звук из рации. Codec2 3200 — контрольный повтор, не улучшенная версия. Оценка новых вариантов ещё не получена.</p>
<h2>Оригинал и вход кодека</h2><section id="references"></section><h2>Варианты</h2><section id="tracks"></section>
<footer><label>Твоя оценка выбранной записи и кодека<textarea id="feedback" placeholder="Какие слова не разобрал? Устраивает ли качество?"></textarea></label><button id="export" type="button">Скачать оценку JSON</button><span id="message" role="status"></span><a href="ATTRIBUTION.txt">Источники и лицензия записей</a></footer></main>
<script>
const data=__PACK_DATA__;const $=id=>document.getElementById(id);const answers={};
data.samples.forEach(s=>$('sample').add(new Option(`${s.id} · ${s.duration_seconds.toFixed(2)} с`,s.id)));data.codecs.forEach(c=>$('codec').add(new Option(c,c)));
const key=()=>`${$('sample').value}:${$('codec').value}:${$('condition').value}`;
function player(t){const el=document.createElement('article'),p=document.createElement('p'),a=document.createElement('audio');p.textContent=t.label;a.controls=true;a.preload='metadata';a.src=t.path;a.setAttribute('aria-label',t.label);el.append(p,a);return el}
function render(){const s=data.samples.find(s=>s.id===$('sample').value);$('references').replaceChildren(...s.tracks.filter(t=>t.codec==='reference').map(player));const rows=s.tracks.filter(t=>t.codec!=='reference'&&($('codec').value==='all'||t.codec===$('codec').value)&&($('condition').value==='clean'?t.condition==='clean':t.condition!=='clean'));$('tracks').replaceChildren(...rows.map(player));$('feedback').value=answers[key()]||'';$('message').textContent=''}
['sample','codec','condition'].forEach(id=>$(id).addEventListener('change',render));$('feedback').addEventListener('input',()=>answers[key()]=$('feedback').value);document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,pack_id:data.pack_id,audio_set_sha256:data.audio_set_sha256,answers,source:'user-entered-not-automatic-score'},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='codec-listening-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent='Файл оценки подготовлен'});render();
</script></html>
